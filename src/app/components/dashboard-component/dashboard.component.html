<mat-card class="menuCard">
    <mat-card-content>
        <button mat-raised-button routerLinkActive="active" routerLink="/vehicles" class="menuBtn">Járművek</button>
    </mat-card-content>
</mat-card>

<div class="container">
    <mat-card class="card">
        <h2 class="title">Profil</h2>
        <mat-card-content>
            <div class="content">
                <span class="type">Név: </span>
                <span class="value">{{ this.name.split('"')[1] }}</span>
            </div>
            
            <div class="content">
                <span class="type">Felhasználónév: </span>
                <span class="value">{{ this.username.split('"')[1] }}</span>
            </div>
            
            <button mat-raised-button (click)="logout()" class="submit" style="margin-top: 30px;">
                Kijelentkezés
            </button>
        </mat-card-content>
    </mat-card>
</div>
